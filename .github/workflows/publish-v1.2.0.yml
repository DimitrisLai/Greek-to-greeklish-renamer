name: Publish public v1.2.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.2.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Install documentation build tool
        run: |
          python -m pip install --disable-pip-version-check reportlab
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Generate final PDF and ZIP downloads
        run: |
          mkdir -p dist
          python docs/generate_manual.py --output dist/Greek_to_Greeklish_Renamer_User_Manual_v1.2.0_Dimitris_Laidis.pdf
          python docs/build_release.py --output dist
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from reportlab.pdfbase.pdfdoc import PDFCatalog
          manual=Path("dist/Greek_to_Greeklish_Renamer_User_Manual_v1.2.0_Dimitris_Laidis.pdf")
          assert manual.stat().st_size > 10000
          for archive in sorted(Path("dist").glob("*.zip")):
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  assert any(n.endswith(manual.name) for n in z.namelist())
              print("Validated:", archive)
          PY

      - name: Publish or refresh GitHub release and attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 dist/*.zip dist/*.pdf --clobber
            gh release edit v1.2.0 --notes-file RELEASE_NOTES.md
          else
            gh release create v1.2.0 dist/*.zip dist/*.pdf \
              --target "$GITHUB_SHA" \
              --title "Greek to Greeklish Renamer v1.2.0" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

      - name: Keep public PDF in the repository
        run: |
          cp dist/Greek_to_Greeklish_Renamer_User_Manual_v1.2.0_Dimitris_Laidis.pdf docs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Greek_to_Greeklish_Renamer_User_Manual_v1.2.0_Dimitris_Laidis.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish final v1.2.0 PDF manual"
            git push origin HEAD:main
          fi

      - name: Set search-friendly repository topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          topics=["greeklish","greek","transliteration","elot-743","python",
                  "file-renamer","batch-rename","windows","unicode","cli"]
          with open("/tmp/topics.json","w",encoding="utf-8") as f:
              json.dump({"names":topics},f)
          PY
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/topics" \
            -H "Accept: application/vnd.github+json" \
            --input /tmp/topics.json
