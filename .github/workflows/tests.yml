name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke-test logic
        run: python greeklish_gui.py --self-test
      - name: Exercise Black/Light theme with real Tk widgets (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/theme_gui_smoke.py
